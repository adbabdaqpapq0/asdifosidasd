<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>야르 - 회원가입</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>야르 회원가입</h1>

    <input
        id="user-id"
        type="text"
        placeholder="ID"
    >

    <br><br>

    <input
        id="password"
        type="password"
        placeholder="비밀번호"
    >

    <br><br>

    <input
        id="nickname"
        type="text"
        placeholder="닉네임"
    >

    <br><br>

    <button id="signup-button">
        회원가입
    </button>

    <button id="back-button">
        로그인으로 돌아가기
    </button>

    <br><br>

    <button id="home-button">
        돌아가기
    </button>


    <script
        type="module"
        src="js/signup.js"
    ></script>

</body>

</html>
