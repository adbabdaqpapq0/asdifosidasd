<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>야르 - 로그인</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>야르 로그인</h1>

    <input
        id="user-id"
        type="text"
        placeholder="ID"
    >

    <br><br>

    <input
        id="password"
        type="password"
        placeholder="비밀번호"
    >

    <button
        type="button"
        id="password-toggle-button"
    >
        표시
    </button>

    <br><br>

    <button id="login-button">
        로그인
    </button>

    <button id="signup-button">
        회원가입으로 돌아가기
    </button>

    <br><br>

    <button id="back-button">
        돌아가기
    </button>


    <script
        type="module"
        src="js/login.js"
    ></script>

</body>

</html>
